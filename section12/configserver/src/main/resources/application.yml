server:
  port: 8071

spring:
  application:
    name: configserver
  profiles:
#    active: native
    active: git
  cloud:
    config:
      server:
#        native:
#          search-locations: "classpath:/config"
#          search-locations: "file:///Users//shruti_agarwal1//Documents//config"
          git:
            uri: ${CONFIG_URI}
            username: ${GIT_USERNAME}
            password: ${GIT_PASSWORD}
            default-label: main
            timeout: 5
            clone-on-start: true
            force-pull: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

encrypt:
  key: "/+FkKhrGDnEt5MehYdyZYW9rT6smd1IBashxf4HxhxQ="

decrypt:
  enabled: true

logging:
  pattern:
    level: "%5p[${spring.application.name},%X{trace_id},%X{span_id}]"